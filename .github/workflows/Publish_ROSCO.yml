name: Build and upload to PyPI
# https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
# Best comparable example: https://github.com/pdfo/pdfo

# Build on every pull request (no need for every push) and release change:
on: [pull_request, release]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15]

    steps:
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
        
      - name: Setup GNU Fortran
        if: false == contains( matrix.os, 'windows')
        uses: fortran-lang/setup-fortran@v1

      # macOS runners already ship Apple clang; installing llvm via Homebrew
      # builds from source on untiered images (e.g. macos-14) and breaks.
      - name: Install compiler
        if: contains( matrix.os, 'ubuntu')
        id: install_cc
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: clang
          
      - name: Install mingw-w64 on Windows
        if: contains( matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          install: |
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
              
      - name: Install zeromq ubuntu
        if: contains( matrix.os, 'ubuntu')
        run: |
            sudo apt install libzmq3-dev libzmq5 libczmq-dev libczmq4
              
      - name: Install zeromq mac
        if: contains( matrix.os, 'mac')
        run: |
            brew install zeromq
            
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels linux
        if: contains( matrix.os, 'ubuntu')
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CC: ${{ steps.install_cc.outputs.cc }}
          CXX: ${{ steps.install_cc.outputs.cxx }}

      - name: Build wheels mac-14
        if: contains( matrix.os, 'macos-14')
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CC: clang
          CXX: clang++
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="14.0"

      - name: Build wheels mac-15
        if: contains( matrix.os, 'macos-15')
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CC: clang
          CXX: clang++
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="15.0"

      - name: Build wheels windows
        if: contains( matrix.os, 'windows')
        uses: pypa/cibuildwheel@v2.23.3

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    # upload to PyPI on every tag starting with 'v'
    #if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        #with:
        #  user: __token__
        #  password: ${{ secrets.pypi_password }}
        #  # To test: repository_url: https://test.pypi.org/legacy/
